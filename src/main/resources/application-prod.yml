server:
  forward-headers-strategy: native

spring:
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
      max-lifetime: 1800000

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
