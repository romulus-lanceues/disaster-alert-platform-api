server:
  port: 8080

spring:
  application:
    name: tanaw-api

  task:
    scheduling:
      pool:
        size: 4

  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
      hibernate.type.json_format_mapper: jackson3

  flyway:
    enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

security:
  jwt:
    issuer: "tanaw-api"
    audience: "user"
    access-token-duration: PT10M
    refresh-token-duration: P30D
    secret: ${JWT_SECRET}

usgs:
  base-url: https://earthquake.usgs.gov/fdsnws/event/1
  min-magnitude: 1.0
  poll-interval: PT1M
  connect-timeout: PT5S
  read-timeout: PT20S
  bounding-box:
    min-latitude: 4.0
    max-latitude: 21.5
    min-longitude: 116.0
    max-longitude: 128.0

alert:
  matching:
    batch-size: 200
    backlog-warn-age: PT10M
    max-batches-per-drain: 10

notification:
  dry-run: true
  dispatcher:
    enabled: true
    interval: PT5S
    batch-size: 50
    lease: PT2M
  retry:
    max-attempts: 5
    initial-backoff: PT10S
    max-backoff: PT10M
  fanout:
    max-event-age: PT6H
  discord:
    connect-timeout: PT3S
    read-timeout: PT10S
  crypto:
    key: ${NOTIFICATION_CRYPTO_KEY:}