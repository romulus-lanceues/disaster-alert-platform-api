server:
  port: 8080

spring:
  application:
    name: tanaw-api

  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

security:
  jwt:
    issuer: "tanaw-api"
    audience: "user"
    access-token-duration: PT10M
    refresh-token-duration: P30D
    secret: ${JWT_SECRET}

usgs:
  base-url: https://earthquake.usgs.gov/fdsnws/event/1
  min-magnitude: 1.0
  poll-interval: PT1M
  bounding-box:
    min-latitude: 4.0
    max-latitude: 21.5
    min-longitude: 116.0
    max-longitude: 128.0